<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lexend+Deca:wght@100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Stats preview card component</title>
</head>

<body>
  <main class="container">
    <div class="card">
      <div class="card-img">
        <picture>
          <source srcset="images/image-header-desktop.jpg"media="(min-width:900px)">
          <img src="images/image-header-mobile.jpg" alt="card-img">
        </picture>
        
      </div>
      <div class="card-content">
        <h1>Get <span>insights</span> that help your business grow.</h1>
        <p>Discover the benefits of data analytics and make better decisions regarding revenue, customer
          experience, and overall efficiency.</p>
          <ul class="stats-list">
            <li>
              <h2>10k+</h2>
              <span>companies</span>
            </li>
            <li>
              <h2>314</h2>
              <span>templates</h2>
            </li>
            <li>
              <h2>12m+</h2>
              <span>queries</span>
            </li>
          </ul>
      </div>

    </div>
  </main>
</body>

</html>
